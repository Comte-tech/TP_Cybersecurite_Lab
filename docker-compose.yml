version: '3.8'

services:
  # --- PARTIE OFFENSIVE (RED TEAM) ---
  dvwa:
    image: vulnerables/web-dvwa
    container_name: lab-dvwa
    ports:
      - "80:80"
    restart: always

  # --- PARTIE DÉFENSIVE / SECOPS (BLUE TEAM) ---
  node-exporter:
    image: quay.io/prometheus/node-exporter
    container_name: lab-node-exporter
    network_mode: "host"
    pid: "host"
    volumes:
      - "/:/host:ro,rslave"
    command:
      - '--path.rootfs=/host'
    restart: always

  prometheus:
    image: prom/prometheus
    container_name: lab-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    restart: always

  grafana:
    image: grafana/grafana
    container_name: lab-grafana
    ports:
      - "3000:3000"
    restart: always